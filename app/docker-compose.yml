services:
  ossbridge:
    # The same image as the Hugging Face Space. The backend also serves the frontend.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ossbridge
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RESULTS_PATH=${RESULTS_PATH:-/data/results}
      - INDEX_PATH=${INDEX_PATH:-/data/dependents-index}
      - SYNC_MINUTES=${SYNC_MINUTES:-5}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-1GB}
      # Optional. It lets the app start analyses on GitHub Actions.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Writable. Results of analyses started from the app are downloaded into it.
      - ${RESULTS_DIR:-../data/results}:/data/results
      - ${INDEX_DIR:-../data/dependents-index}:/data/dependents-index:ro
    restart: unless-stopped
