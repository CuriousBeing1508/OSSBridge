version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ossbridge-backend
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
      - RESULTS_PATH=${RESULTS_PATH:-/data/results}
      - INDEX_PATH=${INDEX_PATH:-/data/dependents-index}
      # Optional: lets the app start analyses on GitHub Actions (export it in the shell)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Writable: results of analyses started from the app are downloaded into it
      - ${RESULTS_DIR:-../data/results}:/data/results
      - ${INDEX_DIR:-../data/dependents-index}:/data/dependents-index:ro
    restart: unless-stopped
    networks:
      - ossbridge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ossbridge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ossbridge-network

networks:
  ossbridge-network:
    driver: bridge